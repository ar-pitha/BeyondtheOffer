<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Carousel slides for lib/post.js: white cards, real company logos, one slide per screenshot (1080x1350). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800;900&display=block" rel="stylesheet">
<style>
  :root {
    --accent: #4f46e5;
    --tint: #eef0ff;
    --ink: #0b0c14;
    --body: #3b3f4f;
    --muted: #7a7f93;
    --line: #e7e8ef;
    --urgent: #c2410c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  body { font-family: "Schibsted Grotesk", "Segoe UI", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 112px 112px 0; display: flex; flex-direction: column; background: #fff; overflow: hidden; }

  .top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  .brand i { width: 18px; height: 18px; border-radius: 6px; background: var(--accent); }
  .count { font-size: 28px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bottom { position: absolute; left: 112px; right: 112px; bottom: 76px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 600; color: var(--muted); }
  .bottom b { color: var(--ink); font-weight: 800; }
  .swipe { display: flex; align-items: center; gap: 12px; color: var(--accent); font-weight: 800; }

  .pill { align-self: flex-start; padding: 14px 26px; border-radius: 999px; background: var(--tint); color: var(--accent); font-size: 30px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; }
  .hl { color: var(--accent); }

  /* cover */
  .cover .pill { margin-top: 92px; }
  .hook { margin-top: 40px; font-size: 112px; line-height: 1.0; font-weight: 900; letter-spacing: -0.035em; }
  .hook.long { font-size: 92px; }
  .sub { margin-top: 36px; font-size: 42px; line-height: 1.3; font-weight: 500; color: var(--body); max-width: 820px; }
  .logos { margin-top: auto; margin-bottom: 200px; display: flex; gap: 22px; flex-wrap: wrap; }
  .logos .tile { width: 148px; height: 148px; }

  /* logo tile: square for icons, wide for wordmarks (set from the image's shape) */
  .tile { display: flex; align-items: center; justify-content: center; background: #fff; border: 2px solid var(--line); border-radius: 32px; padding: 22px; box-shadow: 0 10px 30px rgba(15, 18, 40, 0.06); }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .tile .mono { width: 100%; height: 100%; border-radius: 20px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 64px; }

  /* item */
  .item .tile.big { margin-top: 84px; width: 248px; height: 248px; padding: 36px; border-radius: 44px; }
  .item .tile.big.wide { width: 560px; height: 220px; padding: 34px 48px; }
  .company { margin-top: 44px; display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 800; color: var(--body); }
  .badge { padding: 8px 18px; border-radius: 999px; background: #e9f8ef; color: #15803d; font-size: 24px; font-weight: 800; letter-spacing: 0.02em; }
  .title { margin-top: 18px; font-size: 80px; line-height: 1.04; font-weight: 900; letter-spacing: -0.03em; }
  .title.long { font-size: 64px; }
  .title.xlong { font-size: 52px; line-height: 1.12; letter-spacing: -0.02em; }
  .facts { margin-top: 44px; list-style: none; border-top: 2px solid var(--line); }
  .facts li { display: flex; gap: 22px; align-items: baseline; padding: 22px 0; border-bottom: 2px solid var(--line); font-size: 38px; line-height: 1.25; font-weight: 600; color: var(--body); }
  .facts li::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 4px; background: var(--accent); transform: translateY(-6px); }
  .deadline { position: absolute; left: 112px; right: 112px; bottom: 156px; display: flex; justify-content: space-between; align-items: center; padding: 30px 40px; border-radius: 28px; background: var(--ink); color: #fff; font-size: 38px; font-weight: 800; }
  .deadline span { color: #b8bccb; font-weight: 600; font-size: 30px; }

  /* statement (a slide with no company: the stake, a tip) */
  .statement .text { margin-top: auto; margin-bottom: auto; font-size: 88px; line-height: 1.06; font-weight: 900; letter-spacing: -0.03em; }
  .statement .text.long { font-size: 68px; }
  .statement .text.xlong { font-size: 54px; line-height: 1.14; letter-spacing: -0.02em; }
  .statement .more { margin-top: -40px; margin-bottom: 240px; font-size: 40px; line-height: 1.35; color: var(--body); font-weight: 500; }

  /* recap */
  .recap h2 { margin-top: 72px; font-size: 76px; line-height: 1.04; font-weight: 900; letter-spacing: -0.03em; }
  .rows { margin-top: 44px; display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 26px; padding: 18px 26px 18px 18px; border: 2px solid var(--line); border-radius: 28px; }
  .row .tile { width: 104px; height: 104px; padding: 14px; border-radius: 22px; box-shadow: none; flex: none; }
  .row .tile .mono { font-size: 44px; border-radius: 14px; }
  .row .what { flex: 1; min-width: 0; }
  .row .what b { display: block; font-size: 36px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .what small { display: block; margin-top: 4px; font-size: 28px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .when { flex: none; font-size: 28px; font-weight: 800; color: var(--accent); text-align: right; }
  .rows.tight { gap: 14px; }
  .rows.tight .row { padding-top: 10px; padding-bottom: 10px; }
  .rows.tight .row .tile { width: 80px; height: 80px; padding: 10px; }
  .rows.tight .row .what b { font-size: 32px; }
  .rows.tight .row .what small { font-size: 26px; }
  .rows.roomy { gap: 24px; }
  .rows.roomy .row { padding: 28px 34px 28px 28px; border-radius: 34px; }
  .rows.roomy .row .tile { width: 132px; height: 132px; padding: 18px; }
  .rows.roomy .row .what b { font-size: 44px; }
  .rows.roomy .row .what small { font-size: 32px; }
  .rows.roomy .row .when { font-size: 34px; }
  .recap .note { margin-top: auto; margin-bottom: 176px; font-size: 34px; font-weight: 700; color: var(--muted); }

  /* cta */
  .cta .ask { margin-top: auto; font-size: 60px; font-weight: 800; color: var(--body); }
  .cta .word { align-self: flex-start; margin-top: 18px; padding: 10px 40px 18px; border-radius: 32px; background: var(--accent); color: #fff; font-size: 180px; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
  .cta .then { margin-top: 36px; font-size: 48px; line-height: 1.25; font-weight: 800; }
  .cta .steps { margin-top: 64px; margin-bottom: 220px; list-style: none; display: flex; flex-direction: column; gap: 22px; }
  .cta .steps li { display: flex; gap: 24px; align-items: center; font-size: 38px; font-weight: 600; color: var(--body); }
  .cta .steps li b { flex: none; width: 60px; height: 60px; border-radius: 18px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // *word* in the copy → accent colour; otherwise the first number in a hook is highlighted
  const accentize = (s, auto) => {
    const t = esc(s);
    if (/\*[^*]+\*/.test(t)) return t.replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
    return auto ? t.replace(/(₹?\d[\d,.]*\+?\s*(?:LPA|lakh|k|K|%)?)/, '<span class="hl">$1</span>') : t;
  };
  const initials = (name) => String(name || "?").replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
  const tile = (logo, name, cls = "") =>
    `<div class="tile ${cls}">${logo ? `<img src="${logo}" alt="">` : `<div class="mono">${esc(initials(name))}</div>`}</div>`;

  function frame(d, inner, kind) {
    const last = d.index === d.total;
    return `<section class="slide ${kind}">
      <div class="top"><div class="brand"><i></i>BeyondTheOffer</div><div class="count">${d.index}/${d.total}</div></div>
      ${inner}
      <div class="bottom"><b>${esc(d.handle)}</b>${last ? `<span>${esc(d.website)}</span>` : `<span class="swipe">Swipe <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>`}</div>
    </section>`;
  }

  const views = {
    cover: (s) => `
      <div class="pill">${esc(s.kicker)}</div>
      <h1 class="hook ${s.hook.length > 42 ? "long" : ""}">${accentize(s.hook, true)}</h1>
      ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}
      <div class="logos">${(s.logos || []).map((l) => tile(l.logo, l.name)).join("")}</div>`,
    item: (s) => `
      ${s.logo || s.company ? tile(s.logo, s.company, "big") : '<div style="height:84px"></div>'}
      <div class="company">${esc(s.company || "")}${s.verified ? `<span class="badge">✓ ${esc(s.verified)}</span>` : ""}</div>
      <h2 class="title ${s.title.length > 110 ? "xlong" : s.title.length > 40 ? "long" : ""}">${accentize(s.title)}</h2>
      ${s.facts.length ? `<ul class="facts">${s.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${s.deadline ? `<div class="deadline">${esc(s.deadline)}<span>Comment ${esc(s.keyword)} for the link</span></div>` : ""}`,
    statement: (s) => `
      <p class="text ${s.text.length > 150 ? "xlong" : s.text.length > 70 ? "long" : ""}">${accentize(s.text, true)}</p>
      ${s.more ? `<p class="more">${esc(s.more)}</p>` : ""}`,
    recap: (s) => `
      <h2>${accentize(s.heading, true)}</h2>
      <div class="rows ${s.rows.length > 5 ? "tight" : s.rows.length <= 4 ? "roomy" : ""}">${s.rows
        .map((r) => `<div class="row">${tile(r.logo, r.company || r.title)}<div class="what"><b>${esc(r.company || r.title)}</b><small>${esc(r.company ? r.title : "")}</small></div><div class="when">${esc(r.when || "")}</div></div>`)
        .join("")}</div>
      <p class="note">${s.more ? `+${s.more} more in this post. ` : "Screenshot this list. "}Comment ${esc(s.keyword)} for every link.</p>`,
    cta: (s) => `
      <p class="ask">Comment</p>
      <div class="word">${esc(s.keyword)}</div>
      <p class="then">${esc(s.then)}</p>
      <ul class="steps">${s.steps.map((t, i) => `<li><b>${i + 1}</b>${esc(t)}</li>`).join("")}</ul>`,
  };

  // Called once per slide by lib/post.js; resolves once every logo has loaded and been measured
  window.renderSlide = async (d) => {
    document.documentElement.style.setProperty("--accent", d.accent);
    document.documentElement.style.setProperty("--tint", d.tint);
    document.getElementById("root").innerHTML = frame(d, views[d.slide.type](d.slide), d.slide.type);
    const imgs = [...document.querySelectorAll(".tile img")];
    await Promise.all(imgs.map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    for (const img of imgs) if (img.naturalWidth / Math.max(1, img.naturalHeight) > 1.6) img.parentElement.classList.add("wide");
    await document.fonts.ready;
  };
</script>
</body>
</html>
