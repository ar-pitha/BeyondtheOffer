<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Carousel slides for lib/post.js: clean white cards set in Times New Roman (Tinos, its metric twin, where it is not installed), one company per card. Laid out at 1080x1350,
     captured at 1440x1800 (deviceScaleFactor) so text stays sharp after Instagram's compression. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=block" rel="stylesheet">
<style>
  :root {
    --accent: #2f54eb;
    --ink: #111318;
    --body: #3d4250;
    --muted: #7b8091;
    --line: #e8e9ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  body {
    font-family: "Times New Roman", "Tinos", Times, serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 0 104px; display: flex; flex-direction: column; align-items: center; text-align: center; background: #fff; overflow: hidden; }
  .foot { position: absolute; left: 0; right: 0; bottom: 72px; display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 27px; font-weight: 400; color: var(--muted); }
  .foot .swipe { color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .foot .dot { width: 6px; height: 6px; border-radius: 50%; background: #c9ccd6; }
  .hl { color: var(--accent); }

  /* logos sit straight on the white card: no box, border or rounding */
  .tile { display: flex; align-items: center; justify-content: center; }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* cover: everything on one centre line */
  .cover { justify-content: center; padding-bottom: 60px; }
  .hook { font-size: 86px; line-height: 1.12; font-weight: 700; }
  .hook.long { font-size: 72px; }
  .sub { margin-top: 32px; font-size: 37px; line-height: 1.45; font-weight: 400; color: var(--body); max-width: 820px; }
  .logos { margin-top: 72px; display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; max-width: 900px; }
  .logos .tile { width: 136px; height: 136px; }

  /* opening: the whole block is centred on the card, however many facts it has */
  .item, .news { justify-content: center; padding-bottom: 90px; }
  .logo { width: 220px; height: 220px; }
  .logo.wide { width: 400px; height: 130px; }
  .company { margin-top: 40px; font-size: 32px; font-weight: 400; color: var(--muted); }
  .title { margin-top: 12px; font-size: 62px; line-height: 1.16; font-weight: 700; max-width: 860px; }
  .title.long { font-size: 52px; }
  .rule { margin-top: 44px; width: 72px; height: 5px; border-radius: 3px; background: var(--accent); }
  /* details: one soft panel, a label on the left and the fact on the right */
  .facts { margin-top: 44px; width: 100%; background: #f6f7f9; border-radius: 30px; padding: 10px 44px; text-align: left; }
  .facts div { display: grid; grid-template-columns: 236px 1fr; gap: 24px; align-items: baseline; padding: 26px 0; border-bottom: 2px solid #e6e8ee; }
  .facts div:last-child { border-bottom: 0; }
  .facts small { font-size: 29px; font-weight: 400; color: var(--muted); }
  .facts p { font-size: 36px; line-height: 1.34; font-weight: 400; color: var(--ink); }
  .facts div.solo { grid-template-columns: 1fr; }
  .facts.many div { padding: 20px 0; }
  .facts.many p { font-size: 34px; }
  /* a full job card (eligibility, qualification, skills, process, ...): tighter so all of it fits */
  .facts.lots div { grid-template-columns: 210px 1fr; padding: 15px 0; }
  .facts.lots small { font-size: 26px; }
  .facts.lots p { font-size: 30px; line-height: 1.28; }
  .facts.lots.max div { padding: 11px 0; }
  .facts.lots.max p { font-size: 28px; }
  .item:has(.lots) .logo { width: 170px; height: 170px; }
  .item:has(.lots) .logo.wide { width: 340px; height: 110px; }
  .item:has(.lots) .rule { margin-top: 30px; }
  .item:has(.lots) .facts { margin-top: 30px; }

  /* news: a "Did you know?" card. The fact is the headline, numbers in the accent colour,
     a short explainer, then why it matters to a student in the same soft panel as the job facts. */
  .dyk { display: flex; align-items: center; gap: 22px; font-size: 40px; font-style: italic; color: var(--accent); }
  .dyk::before, .dyk::after { content: ""; width: 64px; height: 2px; background: var(--accent); opacity: 0.5; }
  .cover .dyk { margin-bottom: 44px; font-size: 46px; }
  .news .logo { width: 160px; height: 160px; }
  .news .logo.wide { width: 320px; height: 110px; }
  .news .company { margin-top: 28px; }
  .logo + .title { margin-top: 44px; }
  .news .title { font-size: 54px; line-height: 1.18; }
  .news .body { margin-top: 30px; font-size: 35px; line-height: 1.5; color: var(--body); max-width: 860px; }
  .why { margin-top: 40px; width: 100%; background: #f6f7f9; border-radius: 30px; padding: 30px 44px; text-align: left; }
  .why small { display: block; font-size: 28px; color: var(--accent); }
  .why p { margin-top: 8px; font-size: 34px; line-height: 1.42; color: var(--ink); }

  /* statement */
  .statement { justify-content: center; }
  .statement p { font-size: 72px; line-height: 1.16; font-weight: 700; }

  /* profile: plain ring in the accent colour, no gradient */
  .profile { justify-content: center; padding-bottom: 40px; }
  .pic { width: 312px; height: 312px; border-radius: 50%; padding: 7px; border: 5px solid var(--accent); }
  .pic img, .pic .none { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #f1f2f5; }
  .handle { margin-top: 44px; font-size: 54px; font-weight: 700; }
  .line { margin-top: 14px; font-size: 34px; color: var(--body); }
  .follow { margin-top: 52px; padding: 24px 96px; border-radius: 20px; background: var(--accent); color: #fff; font-size: 37px; font-weight: 700; }
  .ask { margin-top: 64px; width: 100%; background: #f6f7f9; border-radius: 30px; padding: 40px 44px; font-size: 36px; line-height: 1.4; color: var(--ink); }
  .ask b { font-weight: 700; color: var(--accent); }
  .ask small { display: block; margin-top: 12px; font-size: 29px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // *word* in the hook → accent colour; stars never show
  const accentize = (s) => esc(s).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
  // Figures in a news headline ("1,122 repos", "95%", "13x") stand out in the accent colour
  const numbers = (s) => esc(s).replace(/(?<![\w.-])(?:US\$|\$|₹)?\d[\d,.]*(?:\s?(?:%|x|lakh|crore|million|billion|trillion))?\+?(?![\w-])/g, '<span class="hl">$&</span>');
  const arrow = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  const views = {
    cover: (s, d) => `
      ${s.dyk ? `<p class="dyk">Did you know?</p>` : ""}
      <h1 class="hook ${s.hook.length > 48 ? "long" : ""}">${accentize(s.hook)}</h1>
      ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}
      <div class="logos">${s.logos.map((l) => `<div class="tile"><img src="${l}" alt=""></div>`).join("")}</div>
      <div class="foot"><span>${esc(d.handle)}</span><i class="dot"></i><span class="swipe">Swipe ${arrow}</span></div>`,
    item: (s, d) => `
      ${s.logo ? `<div class="tile logo"><img src="${s.logo}" alt=""></div>` : ""}
      ${s.company && !s.logo ? `<p class="company">${esc(s.company)}</p>` : ""}
      <h2 class="title ${s.title.length > 48 ? "long" : ""}">${esc(s.title)}</h2>
      <i class="rule"></i>
      ${s.rows.length ? `<div class="facts ${s.rows.length > 7 ? "many lots max" : s.rows.length > 5 ? "many lots" : s.rows.length > 3 ? "many" : ""}">${s.rows.map((r) => `<div class="${r.label ? "" : "solo"}">${r.label ? `<small>${esc(r.label)}</small>` : ""}<p>${esc(r.value)}</p></div>`).join("")}</div>` : ""}
      <div class="foot"><span>${esc(d.handle)}</span></div>`,
    news: (s, d) => `
      ${s.logo ? `<div class="tile logo"><img src="${s.logo}" alt=""></div>` : ""}
      ${s.company && !s.logo ? `<p class="company">${esc(s.company)}</p>` : ""}
      <h2 class="title">${numbers(s.title)}</h2>
      ${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}
      ${s.why ? `<div class="why"><small>Why it matters for you</small><p>${esc(s.why)}</p></div>` : ""}
      <div class="foot"><span>${esc(d.handle)}</span></div>`,
    statement: (s, d) => `<p>${accentize(s.text)}</p><div class="foot"><span>${esc(d.handle)}</span></div>`,
    profile: (s, d) => `
      <div class="pic">${s.picture ? `<img src="${s.picture}" alt="">` : `<div class="none"></div>`}</div>
      <p class="handle">${esc(d.handle)}</p>
      <p class="line">${esc(s.line)}</p>
      <div class="follow">Follow</div>
      <p class="ask">${esc(s.ask).replace(esc(s.keyword), `<b>${esc(s.keyword)}</b>`)}<small>Save this post and share it with your batch</small></p>`,
  };

  // Called once per slide by lib/post.js; resolves once every image has loaded and been measured
  window.renderSlide = async (d) => {
    document.documentElement.style.setProperty("--accent", d.accent);
    document.getElementById("root").innerHTML = `<section class="slide ${d.slide.type}">${views[d.slide.type](d.slide, d)}</section>`;
    const imgs = [...document.querySelectorAll("img")];
    await Promise.all(imgs.map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    // Wordmarks get a wide tile, icons a square one
    for (const img of document.querySelectorAll(".logo img")) if (img.naturalWidth / Math.max(1, img.naturalHeight) > 1.6) img.parentElement.classList.add("wide");
    await document.fonts.ready;
  };
</script>
</body>
</html>
