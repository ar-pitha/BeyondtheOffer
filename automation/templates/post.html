<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Carousel slides for lib/post.js: clean white cards, one company per card. Laid out at 1080x1350,
     captured at 1440x1800 (deviceScaleFactor) so text stays sharp after Instagram's compression. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=block" rel="stylesheet">
<style>
  :root {
    --accent: #2f54eb;
    --ink: #111318;
    --body: #3d4250;
    --muted: #7b8091;
    --line: #e8e9ee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  body {
    font-family: "Inter", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    font-feature-settings: "cv11", "ss01";
  }
  .slide { position: relative; width: 1080px; height: 1350px; padding: 120px 112px 0; display: flex; flex-direction: column; background: #fff; overflow: hidden; }
  .foot { position: absolute; left: 112px; right: 112px; bottom: 84px; display: flex; justify-content: space-between; align-items: center; font-size: 28px; font-weight: 500; color: var(--muted); }
  .foot .swipe { color: var(--accent); display: flex; align-items: center; gap: 10px; }
  .hl { color: var(--accent); }

  .tile { display: flex; align-items: center; justify-content: center; background: #fff; border: 2px solid var(--line); border-radius: 28px; padding: 22px; }
  .tile img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* cover */
  .kicker { margin-top: 40px; font-size: 32px; font-weight: 500; color: var(--accent); }
  .hook { margin-top: 28px; font-size: 88px; line-height: 1.1; font-weight: 600; letter-spacing: -0.025em; }
  .hook.long { font-size: 74px; }
  .sub { margin-top: 36px; font-size: 38px; line-height: 1.4; font-weight: 400; color: var(--body); max-width: 840px; }
  .logos { margin-top: auto; margin-bottom: 210px; display: flex; gap: 20px; flex-wrap: wrap; }
  .logos .tile { width: 136px; height: 136px; padding: 20px; }

  /* opening: the block sits in the middle of the card, however much there is */
  .main { margin: auto 0; padding-bottom: 110px; }
  .logo { margin-top: 0; width: 216px; height: 216px; padding: 34px; border-radius: 36px; }
  .logo.wide { width: 500px; height: 196px; padding: 34px 46px; }
  .company { margin-top: 52px; font-size: 34px; font-weight: 500; color: var(--muted); }
  .title { margin-top: 14px; font-size: 66px; line-height: 1.14; font-weight: 600; letter-spacing: -0.02em; }
  .title.long { font-size: 54px; }
  .rows { margin-top: 52px; border-top: 2px solid var(--line); }
  .rows div { padding: 24px 0; border-bottom: 2px solid var(--line); }
  .rows small { display: block; font-size: 26px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .rows p { font-size: 36px; line-height: 1.35; font-weight: 400; color: var(--ink); }
  .rows.many div { padding: 18px 0; }
  .rows.many p { font-size: 33px; }

  /* news */
  .news .body { margin-top: 36px; font-size: 38px; line-height: 1.45; color: var(--body); }

  /* statement */
  .statement p { margin: auto 0; font-size: 72px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; }

  /* profile */
  .profile { align-items: center; text-align: center; padding-top: 170px; }
  .pic { width: 320px; height: 320px; border-radius: 50%; padding: 8px; background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
  .pic img, .pic .none { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #fff; object-fit: cover; display: block; background: #f1f2f5; }
  .handle { margin-top: 44px; font-size: 54px; font-weight: 600; letter-spacing: -0.015em; }
  .line { margin-top: 16px; font-size: 34px; color: var(--body); }
  .follow { margin-top: 56px; padding: 26px 92px; border-radius: 22px; background: var(--accent); color: #fff; font-size: 38px; font-weight: 600; }
  .ask { margin-top: 64px; padding-top: 48px; border-top: 2px solid var(--line); width: 100%; font-size: 36px; line-height: 1.4; color: var(--ink); }
  .ask b { font-weight: 600; color: var(--accent); }
  .hint { margin-top: 18px; font-size: 30px; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // *word* in the hook → accent colour; stars never show
  const accentize = (s) => esc(s).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
  const arrow = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  const views = {
    cover: (s, d) => `
      <p class="kicker">${esc(s.kicker)}</p>
      <h1 class="hook ${s.hook.length > 48 ? "long" : ""}">${accentize(s.hook)}</h1>
      ${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}
      <div class="logos">${s.logos.map((l) => `<div class="tile"><img src="${l}" alt=""></div>`).join("")}</div>
      <div class="foot"><span>${esc(d.handle)}</span><span class="swipe">Swipe ${arrow}</span></div>`,
    item: (s, d) => `<div class="main">
      ${s.logo ? `<div class="tile logo"><img src="${s.logo}" alt=""></div>` : ""}
      ${s.company ? `<p class="company">${esc(s.company)}</p>` : ""}
      <h2 class="title ${s.title.length > 48 ? "long" : ""}">${esc(s.title)}</h2>
      ${s.rows.length ? `<div class="rows ${s.rows.length > 3 ? "many" : ""}">${s.rows.map((r) => `<div>${r.label ? `<small>${esc(r.label)}</small>` : ""}<p>${esc(r.value)}</p></div>`).join("")}</div>` : ""}
      </div><div class="foot"><span>${esc(d.handle)}</span></div>`,
    news: (s, d) => `<div class="main">
      ${s.logo ? `<div class="tile logo"><img src="${s.logo}" alt=""></div>` : ""}
      ${s.company ? `<p class="company">${esc(s.company)}</p>` : ""}
      <h2 class="title long">${esc(s.title)}</h2>
      ${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}
      </div><div class="foot"><span>${esc(d.handle)}</span></div>`,
    statement: (s, d) => `<p>${accentize(s.text)}</p><div class="foot"><span>${esc(d.handle)}</span></div>`,
    profile: (s, d) => `
      <div class="pic">${s.picture ? `<img src="${s.picture}" alt="">` : `<div class="none"></div>`}</div>
      <p class="handle">${esc(d.handle)}</p>
      <p class="line">${esc(s.line)}</p>
      <div class="follow">Follow</div>
      <p class="ask">${esc(s.ask).replace(esc(s.keyword), `<b>${esc(s.keyword)}</b>`)}</p>
      <p class="hint">Save this post and share it with your batch</p>`,
  };

  // Called once per slide by lib/post.js; resolves once every image has loaded and been measured
  window.renderSlide = async (d) => {
    document.documentElement.style.setProperty("--accent", d.accent);
    document.getElementById("root").innerHTML = `<section class="slide ${d.slide.type}">${views[d.slide.type](d.slide, d)}</section>`;
    const imgs = [...document.querySelectorAll("img")];
    await Promise.all(imgs.map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    // Wordmarks get a wide tile, icons a square one
    for (const img of document.querySelectorAll(".logo img")) if (img.naturalWidth / Math.max(1, img.naturalHeight) > 1.6) img.parentElement.classList.add("wide");
    await document.fonts.ready;
  };
</script>
</body>
</html>
