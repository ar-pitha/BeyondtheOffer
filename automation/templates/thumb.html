<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Reel cover, 1080x1920 (lib/officialReel.js), after the page owner's design (image.png, Nov 22):
     the company's logo large, a thin rule, "Campus Hiring 2027" in a slanted band, and the role
     beside a bar. Corner bands top-left and bottom-right. All in the company's colour, read from
     its logo. The content sits in the middle 1080x1440 the profile grid shows. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=block" rel="stylesheet">
<style>
  :root { --c: #1f45d6; --ink: #0d1020; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: Poppins, Arial, sans-serif; color: var(--ink); }
  * { box-sizing: border-box; }
  .tl { position: absolute; left: 0; top: 0; width: 420px; height: 560px; }
  .br { position: absolute; right: 0; bottom: 0; width: 460px; height: 600px; }
  .logo { position: absolute; left: 110px; right: 90px; top: 470px; height: 230px; display: flex; align-items: center; justify-content: center; }
  .logo img { max-width: 100%; max-height: 200px; object-fit: contain; }
  .rule { position: absolute; left: 340px; right: 340px; top: 760px; height: 6px; border-radius: 3px; background: var(--c); }
  .band { position: absolute; left: 80px; right: 70px; top: 830px; height: 150px; background: var(--c); clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%);
    display: flex; align-items: center; justify-content: center; color: #fff; font: 700 74px/1 Poppins; letter-spacing: -.5px; white-space: nowrap; }
  .role { position: absolute; left: 90px; right: 70px; top: 1060px; display: flex; gap: 56px; align-items: stretch; }
  .role i { flex: none; width: 22px; background: var(--c); }
  .role span { font: 700 104px/1.12 Poppins; letter-spacing: -1.5px; }
</style>
</head>
<body>
<svg class="tl" viewBox="0 0 420 560"><path d="M0 0 H300 L0 360 Z" fill="var(--c)"/><path d="M330 0 H420 L0 520 V420 Z" fill="color-mix(in srgb, var(--c) 32%, white)"/></svg>
<svg class="br" viewBox="0 0 460 600"><path d="M460 0 V600 H0 Z" fill="color-mix(in srgb, var(--c) 80%, white)"/><path d="M460 180 V600 H120 Z" fill="var(--c)"/><path d="M460 120 L70 600 H40 L460 90 Z" fill="#fff"/></svg>
<div class="logo" id="logo"></div>
<div class="rule"></div>
<div class="band" id="band"></div>
<div class="role"><i></i><span id="role"></span></div>
<script>
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // The company's colour: the most common strong colour in its logo
  async function brandColour(src) {
    const img = new Image();
    img.src = src;
    await img.decode();
    const c = document.createElement("canvas");
    c.width = 120; c.height = Math.max(1, Math.round(120 * img.naturalHeight / img.naturalWidth));
    const g = c.getContext("2d");
    g.drawImage(img, 0, 0, c.width, c.height);
    const px = g.getImageData(0, 0, c.width, c.height).data;
    const bins = new Map();
    for (let i = 0; i < px.length; i += 4) {
      const [r, gg, b, a] = [px[i], px[i + 1], px[i + 2], px[i + 3]];
      const max = Math.max(r, gg, b), min = Math.min(r, gg, b);
      if (a < 200 || max - min < 60 || max < 60) continue;
      const key = [r, gg, b].map((v) => v >> 4).join(",");
      const bin = bins.get(key) || { n: 0, r: 0, g: 0, b: 0 };
      bin.n++; bin.r += r; bin.g += gg; bin.b += b;
      bins.set(key, bin);
    }
    const top = [...bins.values()].sort((x, y) => y.n - x.n)[0];
    if (!top) return null;
    const k = 0.9;
    return `rgb(${Math.round((top.r / top.n) * k)}, ${Math.round((top.g / top.n) * k)}, ${Math.round((top.b / top.n) * k)})`;
  }

  window.render = async (d) => {
    const colour = d.color || (d.logo && (await brandColour(d.logo).catch(() => null))) || "#1f45d6";
    document.documentElement.style.setProperty("--c", colour);
    document.getElementById("logo").innerHTML = d.logo ? `<img src="${d.logo}" alt="">` : `<b style="font:800 150px Poppins;color:var(--c)">${esc(d.company)}</b>`;
    const band = document.getElementById("band");
    band.innerHTML = `<span>${esc(d.band || `Campus Hiring ${d.batch || ""}`.trim())}</span>`;
    document.getElementById("role").innerHTML = esc(d.role).replace(/,?\s+/, "<br>");
    await Promise.all([...document.images].map((img) => (img.complete ? null : new Promise((r) => (img.onload = img.onerror = r)))));
    await document.fonts.ready;
    // Long band text shrinks to fit inside the slant instead of running off it
    const span = band.firstElementChild;
    for (let size = 74; size > 40 && span.scrollWidth > band.clientWidth * 0.8; size -= 2) band.style.fontSize = `${size}px`;
  };
</script>
</body>
</html>
