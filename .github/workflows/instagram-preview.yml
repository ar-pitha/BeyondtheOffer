name: instagram-preview

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Optional Content_Queue ID to render"
        required: false
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TIMEZONE: Asia/Kolkata
      # Optional: sharper logos for small companies (automation/lib/logos.js)
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json
      # --ignore-scripts skips ffmpeg-static's download from GitHub Releases, which fails with 504s
      - run: npm ci --ignore-scripts
        working-directory: automation
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # No --with-deps: see publish.yml
      - run: npx playwright install chromium
        working-directory: automation
      - run: node preview.js ${{ inputs.id && format('--id {0}', inputs.id) || '--all' }}
        working-directory: automation
