name: instagram-preview

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Optional Content_Queue ID to render"
        required: false
        type: string

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TIMEZONE: Asia/Kolkata
      # Optional: sharper logos for small companies (automation/lib/logos.js)
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json
      # --ignore-scripts skips ffmpeg-static's download from GitHub Releases, which fails with 504s
      - run: npm ci --ignore-scripts
        working-directory: automation
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # No --with-deps: see publish.yml
      - run: npx playwright install chromium
        working-directory: automation
      # Job reels (Format=Reel): ffmpeg, and the stock footage and music downloaded once (lib/broll.js, lib/music.js)
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y -o Acquire::Retries=3 ffmpeg)
      - uses: actions/cache@v4
        with:
          path: automation/renders/_broll
          key: broll-${{ hashFiles('automation/lib/broll.js', 'automation/lib/music.js') }}
          restore-keys: broll-
      # A waiting post whose opening closed gets the next most urgent one; its preview is rebuilt below
      - run: node refresh.js
        working-directory: automation
      - run: node preview.js ${{ inputs.id && format('--id {0}', inputs.id) || '--all' }}
        working-directory: automation
