name: daily-news

# Backup for the board, which groups tech news every time it opens (frontend/api/admin-sheet.js):
# every free fresh story goes into a waiting post with a preview, ready in /admin/feed → Posts.
# Nothing is posted until it's sent with "Post now". Jobs, govt jobs and hackathons are grouped by hand.
# A run with nothing new to group does nothing. Also started by a Vercel cron (frontend/vercel.json).
on:
  schedule:
    - cron: "15 2 * * *" # 07:45 IST, after the 06:36 research task: groups and builds the preview
    - cron: "15 3 * * *" # backups, also for a morning with too few stories yet
    - cron: "45 5 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pick and render the stories only, don't write the draft"
        type: boolean
        default: true

# One at a time, so a backup waits for the run in progress instead of racing it
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_ISSUED_AT: ${{ secrets.IG_TOKEN_ISSUED_AT }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      IG_API_BASE: ${{ secrets.IG_API_BASE }}
      IG_API_VERSION: ${{ secrets.IG_API_VERSION }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
      TIMEZONE: Asia/Kolkata
      WEBSITE_URL: ${{ vars.WEBSITE_URL || 'https://beyondtheoffer.vercel.app' }}
      # Scheduled runs write the draft; a manual run is a dry run unless the box is unticked
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automation/package-lock.json

      # --ignore-scripts skips ffmpeg-static's download, which isn't needed for carousels
      - run: npm ci --ignore-scripts
        working-directory: automation
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # No --with-deps: the runner has Chromium's libraries (see publish.yml)
      - run: npx playwright install chromium
        working-directory: automation

      - name: Group the free stories
        id: group
        working-directory: automation
        run: node news-daily.js

      - name: Build the preview
        if: steps.group.outputs.due == 'true'
        working-directory: automation
        run: node preview.js --all

      - name: Keep the slides
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}
          path: automation/renders/
          if-no-files-found: ignore
          retention-days: 7
