name: instagram-replies

# Meta only sends comment/DM webhooks for accounts with a role on the app until Advanced Access
# is approved (docs/meta-app-review.md), so this polls instead: one run checks every 30 seconds
# for almost 6 hours, and the 10-minute timer queues the next run to take over when it ends.
# ponytail: polling, costs about 2,500 Vercel calls a day; go back to one curl per run once
# the webhook delivers for everyone
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: instagram-replies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Sync Instagram comments automatically
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL || 'https://beyondtheoffer.vercel.app' }}
          INSTAGRAM_SYNC_SECRET: ${{ secrets.INSTAGRAM_SYNC_SECRET }}
        run: |
          test -n "$INSTAGRAM_SYNC_SECRET"
          end=$((SECONDS + 340 * 60))
          failures=0
          while [ "$SECONDS" -lt "$end" ]; do
            if curl --fail-with-body --silent --show-error --max-time 60 \
              --request POST "${WEBSITE_URL%/}/api/admin-sheet" \
              --header "Content-Type: application/json" \
              --header "x-instagram-sync-secret: $INSTAGRAM_SYNC_SECRET" \
              --data '{"action":"sync-comments"}'; then
              failures=0
            else
              failures=$((failures + 1))
              # A cold function or a brief Google outage passes; ten in a row is a real fault
              if [ "$failures" -ge 10 ]; then echo "::error::sync failed 10 times in a row"; exit 1; fi
            fi
            echo
            sleep 30
          done
